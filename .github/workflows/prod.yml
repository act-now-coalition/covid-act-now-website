name: Deploy to covidactnow.org

on:
  push:
    branches:
    - main

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role can-site-deploy (no stored AWS keys)

jobs:
  build-deploy:
    name: Build_and_Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: yarn install
      - run: yarn build:prod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::769020224865:role/can-site-deploy
          aws-region: us-east-1
      - run: ./tools/deploy-s3.sh build/ s3://covidactnow-site-769020224865/
      - name: Invalidate CDN files.
        run: aws cloudfront create-invalidation --distribution-id EMVJ85Q1TRRQ3 --paths "/*"
