name: Deploy to covidactnow.org

on:
  push:
    branches:
    - main

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role can-site-deploy (no stored AWS keys)

jobs:
  build-deploy:
    name: Build_and_Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
      - run: yarn install
      - run: yarn build:prod
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::769020224865:role/can-site-deploy
          aws-region: us-east-1
      - run: ./tools/deploy-s3.sh build/ s3://covidactnow-site-769020224865/
      - name: Invalidate CDN files.
        run: aws cloudfront create-invalidation --distribution-id EMVJ85Q1TRRQ3 --paths "/*"
